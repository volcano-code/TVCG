name: Phase 2.8.4 Unified M80 SQNO Contracts
on:
  push:
    branches: [research/phase2-6-r3-m69-hybrid-ablation]
    paths:
      - "research/NeuralMoments/models/pcraft_ufno/spin_pino/**"
      - "research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter/**"
      - ".github/workflows/phase2-8-4-unified-m80-sqno.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/models/pcraft_ufno/spin_pino/**"
      - "research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter/**"
      - ".github/workflows/phase2-8-4-unified-m80-sqno.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install "numpy<2.3" scipy pytest
          python -m pip install torch-scatter -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - name: Compile modules
        run: |
          python -m compileall -q research/NeuralMoments/models/pcraft_ufno/spin_pino
          python -m compileall -q research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter
      - name: Run native P-CRAFT contracts
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q research/NeuralMoments/models/pcraft_ufno/spin_pino/tests/
      - name: Run SQNO and unified contracts
        env:
          PYTHONPATH: .:research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter/tests/

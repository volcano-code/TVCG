name: Phase 2.6 R3 Real Geometry Admission

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_real_geometry_admission_v1.py"
      - "tests/python/test_r3_real_geometry_admission.py"
      - ".github/workflows/phase2-6-r3-real-geometry-admission.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_real_geometry_admission_v1.py"
      - "tests/python/test_r3_real_geometry_admission.py"
      - ".github/workflows/phase2-6-r3-real-geometry-admission.yml"

permissions:
  contents: read

jobs:
  real-geometry-admission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
      - run: python -m py_compile research/NeuralMoments/r3_real_geometry_admission_v1.py
      - name: Run admission contract tests
        env:
          PYTHONPATH: .:research/NeuralMoments
        run: python -m pytest -q tests/python/test_r3_real_geometry_admission.py

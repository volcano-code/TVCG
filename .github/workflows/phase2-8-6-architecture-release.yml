name: Phase 2.8.6 Architecture Release Gate
on:
  push:
    branches: [research/phase2-6-r3-m69-hybrid-ablation]
    paths:
      - "research/NeuralMoments/models/pcraft_ufno/spin_pino/**"
      - "research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter/**"
      - "research/NeuralMoments/models/pcraft_ufno/release_gate/**"
      - ".github/workflows/phase2-8-6-architecture-release.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/models/pcraft_ufno/spin_pino/**"
      - "research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction/spin_adapter/**"
      - "research/NeuralMoments/models/pcraft_ufno/release_gate/**"
      - ".github/workflows/phase2-8-6-architecture-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install "numpy<2.3" scipy pytest
          python -m pip install torch-geometric
          python -m pip install torch-scatter -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - name: Run Phase 2.8.6 release gate
        env:
          PYTHONPATH: .:research/NeuralMoments/models/pcraft_ufno/candidate_projects/quadrann_reproduction
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m research.NeuralMoments.models.pcraft_ufno.release_gate.run_release_gate --profile full --output runs/phase2_8_6_release
      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-8-6-release-report
          path: runs/phase2_8_6_release/

name: Phase 1 Unified Mathematical Contract

on:
  push:
    branches:
      - research/tvcg-initial-import
    paths:
      - "research/NeuralMoments/optimization_contract_v1.py"
      - "research/NeuralMoments/fixtures/phase1_contract_v1_minimal.json"
      - "tests/python/test_phase1_unified_contract.py"
      - "schemas/geometry_conditioned_quadric_pino_contract_v1.schema.json"
      - ".github/workflows/phase1-unified-contract.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/NeuralMoments/optimization_contract_v1.py"
      - "research/NeuralMoments/fixtures/phase1_contract_v1_minimal.json"
      - "tests/python/test_phase1_unified_contract.py"
      - "schemas/geometry_conditioned_quadric_pino_contract_v1.schema.json"
      - ".github/workflows/phase1-unified-contract.yml"

permissions:
  contents: read

jobs:
  phase1-cpu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
      - name: Compile Phase 1 contract module
        run: python -m py_compile research/NeuralMoments/optimization_contract_v1.py
      - name: Validate versioned schema and fixture JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path("schemas/geometry_conditioned_quadric_pino_contract_v1.schema.json").read_text())
          fixture = json.loads(Path("research/NeuralMoments/fixtures/phase1_contract_v1_minimal.json").read_text())
          assert schema["properties"]["schema_version"]["const"] == fixture["schema_version"]
          assert fixture["status"] == "phase1_contract_fixture_not_physical_admission"
          print("schema and fixture JSON parse; version/status bindings agree")
          PY
      - name: Run analytic moment, frame, derivative and KKT tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q tests/python/test_phase1_unified_contract.py

name: Phase 2.6 R3 M69 Admission Audit

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_problem_reconstruction_v1.py"
      - "research/NeuralMoments/r3_m69_corpus_admission_v1.py"
      - "tests/python/test_r3_problem_reconstruction.py"
      - "tests/python/test_r3_m69_corpus_admission.py"
      - ".github/workflows/phase2-6-r3-m69-admission.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_problem_reconstruction_v1.py"
      - "research/NeuralMoments/r3_m69_corpus_admission_v1.py"
      - "tests/python/test_r3_problem_reconstruction.py"
      - "tests/python/test_r3_m69_corpus_admission.py"
      - ".github/workflows/phase2-6-r3-m69-admission.yml"

permissions:
  contents: read

jobs:
  r3-admission-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10"
      - name: Compile R3 admission modules
        run: |
          python -m py_compile research/NeuralMoments/r3_problem_reconstruction_v1.py
          python -m py_compile research/NeuralMoments/r3_m69_corpus_admission_v1.py
      - name: Run R3 admission contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/python/test_r3_problem_reconstruction.py \
            tests/python/test_r3_m69_corpus_admission.py

name: Phase 2.6 R3 Native Build Preflight

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_native_build_preflight_v1.py"
      - "tests/python/test_r3_native_build_preflight.py"
      - ".github/workflows/phase2-6-r3-native-preflight.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_native_build_preflight_v1.py"
      - "tests/python/test_r3_native_build_preflight.py"
      - ".github/workflows/phase2-6-r3-native-preflight.yml"

permissions:
  contents: read

jobs:
  native-build-preflight-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m py_compile research/NeuralMoments/r3_native_build_preflight_v1.py
      - name: Run preflight contract tests
        env:
          PYTHONPATH: .:research/NeuralMoments
        run: python -m pytest -q tests/python/test_r3_native_build_preflight.py

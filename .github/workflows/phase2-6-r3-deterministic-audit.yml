name: Phase 2.6 R3 Deterministic Replay Audit

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_deterministic_replay_audit_v1.py"
      - "tests/python/test_r3_deterministic_replay_audit.py"
      - ".github/workflows/phase2-6-r3-deterministic-audit.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_deterministic_replay_audit_v1.py"
      - "tests/python/test_r3_deterministic_replay_audit.py"
      - ".github/workflows/phase2-6-r3-deterministic-audit.yml"

permissions:
  contents: read

jobs:
  deterministic-replay-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m py_compile research/NeuralMoments/r3_deterministic_replay_audit_v1.py
      - name: Run deterministic replay tests
        env:
          PYTHONPATH: .:research/NeuralMoments
        run: python -m pytest -q tests/python/test_r3_deterministic_replay_audit.py

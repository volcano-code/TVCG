name: Phase 2.6 R3.1.5.5 Double Replay Audit

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_double_replay_audit_v1.py"
      - "research/NeuralMoments/r3_native_solver_replay_v1.py"
      - "research/NeuralMoments/r3_native_independent_moment_compare_v1.py"
      - "tests/python/test_r3_double_replay_audit.py"
      - ".github/workflows/phase2-6-r3-double-replay.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_double_replay_audit_v1.py"
      - "research/NeuralMoments/r3_native_solver_replay_v1.py"
      - "research/NeuralMoments/r3_native_independent_moment_compare_v1.py"
      - "tests/python/test_r3_double_replay_audit.py"
      - ".github/workflows/phase2-6-r3-double-replay.yml"

permissions:
  contents: read

jobs:
  double-replay-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
      - name: Compile replay audit modules
        run: |
          python -m py_compile research/NeuralMoments/r3_double_replay_audit_v1.py
          python -m py_compile research/NeuralMoments/r3_native_solver_replay_v1.py
          python -m py_compile research/NeuralMoments/r3_native_independent_moment_compare_v1.py
      - name: Run double replay evidence tests
        env:
          PYTHONPATH: .:python:research/NeuralMoments
        run: python -m pytest -q tests/python/test_r3_double_replay_audit.py

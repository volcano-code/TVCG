name: Phase 2.6 R3 Faster Initialization Contract

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_faster_initialization_v1.py"
      - "tests/python/test_r3_faster_initialization.py"
      - ".github/workflows/phase2-6-r3-faster-init.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_faster_initialization_v1.py"
      - "tests/python/test_r3_faster_initialization.py"
      - ".github/workflows/phase2-6-r3-faster-init.yml"

permissions:
  contents: read

jobs:
  faster-init-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m py_compile research/NeuralMoments/r3_faster_initialization_v1.py
      - name: Run initialization contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/python/test_r3_faster_initialization.py

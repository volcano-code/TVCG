name: Phase 2.6 R3.1.5 Independent Tetra Moments

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_independent_tetra_moments_v1.py"
      - "tests/python/test_r3_independent_tetra_moments.py"
      - ".github/workflows/phase2-6-r3-independent-moments.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_independent_tetra_moments_v1.py"
      - "tests/python/test_r3_independent_tetra_moments.py"
      - ".github/workflows/phase2-6-r3-independent-moments.yml"

permissions:
  contents: read

jobs:
  independent-tetra-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
      - run: python -m py_compile research/NeuralMoments/r3_independent_tetra_moments_v1.py
      - name: Run independent moment tests
        env:
          PYTHONPATH: .:research/NeuralMoments
        run: python -m pytest -q tests/python/test_r3_independent_tetra_moments.py

name: Phase 2.6 R3 Geometry Adapter

on:
  push:
    branches:
      - research/phase2-6-r3-m69-hybrid-ablation
    paths:
      - "research/NeuralMoments/r3_geometry_adapter_v1.py"
      - "tests/python/test_r3_geometry_adapter.py"
      - ".github/workflows/phase2-6-r3-geometry-adapter.yml"
  pull_request:
    paths:
      - "research/NeuralMoments/r3_geometry_adapter_v1.py"
      - "tests/python/test_r3_geometry_adapter.py"
      - ".github/workflows/phase2-6-r3-geometry-adapter.yml"

permissions:
  contents: read

jobs:
  geometry-adapter-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
      - name: Compile adapter
        run: python -m py_compile research/NeuralMoments/r3_geometry_adapter_v1.py
      - name: Run adapter tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/python/test_r3_geometry_adapter.py

name: Phase 2.3 Differentiable M69 Physical KKT

on:
  push:
    branches:
      - research/tvcg-initial-import
    paths:
      - "research/NeuralMoments/phase2_3_differentiable_m69_kkt.py"
      - "tests/python/test_phase2_3_differentiable_m69_kkt.py"
      - ".github/workflows/phase2-3-differentiable-kkt.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/NeuralMoments/phase2_3_differentiable_m69_kkt.py"
      - "tests/python/test_phase2_3_differentiable_m69_kkt.py"
      - ".github/workflows/phase2-3-differentiable-kkt.yml"

permissions:
  contents: read

jobs:
  differentiable-m69-kkt-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Phase 2.3 implementation
        run: python -m py_compile research/NeuralMoments/phase2_3_differentiable_m69_kkt.py
      - name: Run differentiable M69 and KKT tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q tests/python/test_phase2_3_differentiable_m69_kkt.py

name: Phase 2.5 End-to-End Neural Optimization

on:
  push:
    branches:
      - research/tvcg-initial-import
    paths:
      - "research/NeuralMoments/phase2_5_end_to_end_solver.py"
      - "tests/python/test_phase2_5_end_to_end_solver.py"
      - ".github/workflows/phase2-5-end-to-end-solver.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/NeuralMoments/phase2_5_end_to_end_solver.py"
      - "tests/python/test_phase2_5_end_to_end_solver.py"
      - ".github/workflows/phase2-5-end-to-end-solver.yml"

permissions:
  contents: read

jobs:
  phase25-solver-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Phase 2.5 solver
        run: python -m py_compile research/NeuralMoments/phase2_5_end_to_end_solver.py
      - name: Run Phase 2.5 end-to-end solver tests
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q tests/python/test_phase2_5_end_to_end_solver.py
      - name: Run multi-seed exact versus surrogate comparison
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from research.NeuralMoments.phase2_5_end_to_end_solver import compare_exact_and_surrogate
          result = compare_exact_and_surrogate(seeds=(2501,2502,2503), max_iterations=30)
          with open("phase2_5_synthetic_qp_results.json", "w") as f:
              json.dump(result, f, indent=2, sort_keys=True)
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload Phase 2.5 results
        uses: actions/upload-artifact@v4
        with:
          name: phase2-5-synthetic-qp-results
          path: phase2_5_synthetic_qp_results.json
          if-no-files-found: error
